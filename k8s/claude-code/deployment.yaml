apiVersion: v1
kind: ConfigMap
metadata:
  name: claude-code-dockerd-daemon-config
  namespace: default
data:
  daemon.json: |
    {
      "builder": {
        "gc": {
          "enabled": true,
          "defaultKeepStorage": "${DOCKERD_GC_KEEP_STORAGE}"
        }
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: claude-code
  namespace: default
spec:
  replicas: 1
  # docker-data is now a hostPath pointing at one dedicated host-side LV
  # (see kata.nix), not a per-pod emptyDir -- the default RollingUpdate
  # strategy briefly surges a second pod (maxSurge: 25% of 1 replica still
  # rounds up to +1) that would mount the *same* ext4 filesystem from a
  # second, concurrent Kata guest VM with no coordination between them,
  # corrupting it (confirmed live: EUCLEAN mount failures after a
  # RollingUpdate surge). Recreate guarantees the old pod (and its guest's
  # mount) is fully gone before the new one starts.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: claude-code
  template:
    metadata:
      labels:
        app: claude-code
    spec:
      # Runs the whole pod inside a Kata Containers hardware VM, so the
      # dockerd sidecar's `privileged: true` is contained by the hypervisor
      # boundary instead of just Linux namespaces/capabilities.
      runtimeClassName: kata
      serviceAccountName: claude-code
      securityContext:
        fsGroup: 1000
        # docker:27-dind's dind entrypoint chowns docker.sock to its "docker"
        # group (GID 2375), overriding fsGroup's setgid inheritance, so the
        # claude-code container needs that GID explicitly to reach the socket.
        supplementalGroups: [2375]
      containers:
        - name: claude-code
          image: ${IMAGE}
          command: ["/usr/bin/bash", "-c"]
          args:
            # --continue can't be combined with --capacity/--spawn (confirmed
            # via a live failure), and worktree mode needs cwd to be a git
            # repo (this workspace dir isn't one). Simpler tradeoff: give up
            # automatic --continue on redeploy (it wasn't reliably resuming
            # conversation context across pod restarts anyway) in exchange
            # for same-dir mode supporting up to 32 concurrent claude.app
            # sessions in this one workspace directory.
            - "/usr/bin/claude remote-control --capacity=32"
          env:
            - name: DOCKER_HOST
              value: unix:///run/docker-sock/docker.sock
            - name: TZ
              value: Asia/Tokyo
          # Without an explicit memory limit, Kata sizes the guest VM off
          # its own small default (~2GB) instead of the host's real
          # capacity, and --capacity=32 sessions OOMKilled the container
          # under that ceiling. Kata hotplugs guest memory per-container
          # based on each container's own limit (they're additive, not
          # shared), so this and dockerd's limit below both count toward
          # the guest total.
          resources:
            requests:
              memory: 2Gi
            limits:
              memory: 4Gi
          volumeMounts:
            - name: home
              mountPath: /home/claude
            - name: docker-sock
              mountPath: /run/docker-sock
        - name: dockerd
          image: docker:27-dind
          # dind image builds (e.g. compiling wheels for a python image) ran
          # this out of memory with no limit set here, since without a
          # per-container limit Kata never hotplugs guest memory for it.
          #
          # docker-data is now a real block-backed volume (see below), not
          # tmpfs, so image layers/build cache no longer count against this
          # cgroup limit the way tmpfs pages did -- the previous 8Gi/4Gi
          # split existed purely to leave headroom above the old tmpfs
          # sizeLimit (hiroshi/nixos#19) and is no longer needed for that
          # reason, but left as-is here since dockerd's own real memory
          # needs under load haven't been separately profiled yet.
          resources:
            requests:
              memory: 4Gi
            limits:
              memory: 8Gi
          # Only docker.sock needs to be shared with the claude-code
          # container, so it gets its own subdirectory instead of all of
          # /var/run. Sharing the whole of /var/run would also share
          # containerd's exec-root (pidfiles etc.), which lives on the
          # emptyDir and therefore survives container restarts within the
          # pod unlike the container's own rootfs — a stale pidfile left
          # behind by an unclean shutdown then makes the next start refuse
          # to run, thinking the old (reused) PID is still containerd.
          args:
            - --host=unix:///run/docker-sock/docker.sock
          securityContext:
            privileged: true
          volumeMounts:
            - name: docker-sock
              mountPath: /run/docker-sock
            # dockerd's default /var/lib/docker sits on the pod's own
            # virtiofs-backed rootfs, and overlay2 can't mount on top of
            # virtiofs ("invalid argument"), so dockerd would otherwise fall
            # back to the vfs storage driver, which doesn't support xattrs
            # and breaks multi-stage `COPY --chown` builds. This hostPath is
            # a Kata direct-assigned block volume (see kata.nix's
            # kata-docker-data-directvol-setup unit, hiroshi/nixos#32/#37) --
            # a real ext4-formatted LV hotplugged into the guest as an
            # actual block device, so overlay2 works and layers/build cache
            # no longer count against the pod's memory cgroup like the
            # previous tmpfs emptyDir did.
            - name: docker-data
              mountPath: /var/lib/docker
            # subPath so only this one file is mounted, not the whole
            # /etc/docker directory -- avoids clobbering anything the dind
            # entrypoint might place there.
            - name: dockerd-daemon-config
              mountPath: /etc/docker/daemon.json
              subPath: daemon.json
              readOnly: true
        - name: docker-df-exporter
          # `docker system df`'s numbers (images/containers/volumes/build
          # cache disk usage) aren't visible through the existing OTel
          # Collector metrics (see monitoring.nix's file header): that
          # collector's kubeletstats receiver reads kubelet's cgroup
          # resource-usage view via the Summary API, which has no concept
          # of dockerd's own storage bookkeeping -- a different data source
          # (dockerd's Engine API, /system/df) entirely. This is a small,
          # separate poll loop hitting that API directly over the shared
          # docker-sock volume and pushing straight to VictoriaMetrics's
          # Prometheus import endpoint on a timer. Image source:
          # docker-df-exporter/ (built/pushed via this dir's Makefile).
          image: ${DOCKER_DF_EXPORTER_IMAGE}
          resources:
            requests:
              memory: 32Mi
            limits:
              memory: 64Mi
          volumeMounts:
            - name: docker-sock
              mountPath: /run/docker-sock
      volumes:
        - name: home
          persistentVolumeClaim:
            claimName: claude-code-home
        - name: docker-sock
          emptyDir: {}
        - name: docker-data
          hostPath:
            # Must match kata.nix's `dockerDataDirectVolPath` exactly --
            # Kata's virtcontainers matches the direct-volume registry on
            # this literal path string, not on the underlying LV/device.
            path: /var/lib/kata-directvol/claude-code-docker-data
            type: DirectoryOrCreate
        - name: dockerd-daemon-config
          configMap:
            name: claude-code-dockerd-daemon-config
