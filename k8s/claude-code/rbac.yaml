apiVersion: v1
kind: ServiceAccount
metadata:
  name: claude-code
  namespace: default
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: claude-code-edit
  namespace: default
subjects:
  - kind: ServiceAccount
    name: claude-code
    namespace: default
roleRef:
  kind: ClusterRole
  name: edit
  apiGroup: rbac.authorization.k8s.io
---
# Read-only access cluster-wide (including tenant-portal-managed tenant
# namespaces, for verifying NetworkPolicy isolation from inside a tenant
# pod, and `monitoring`, to inspect the VictoriaMetrics/VictoriaLogs/Perses/
# otel-collector stack) without kubectl port-forward or the Service-DNS+
# urllib workaround. Binds the built-in `view` ClusterRole (kept in sync
# with upstream automatically as new resource types are aggregated into it)
# plus a small supplemental ClusterRole for `pods/log` and `pods/exec`,
# which `view` deliberately excludes by default. Supersedes the old
# `monitoring`-namespace-scoped bindings of the same shape.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: claude-code-view
subjects:
  - kind: ServiceAccount
    name: claude-code
    namespace: default
roleRef:
  kind: ClusterRole
  name: view
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: claude-code-pod-exec
rules:
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: claude-code-pod-exec
subjects:
  - kind: ServiceAccount
    name: claude-code
    namespace: default
roleRef:
  kind: ClusterRole
  name: claude-code-pod-exec
  apiGroup: rbac.authorization.k8s.io
---
# `view` deliberately excludes RBAC resources, so without this claude-code
# can't even `kubectl get clusterrole`/`clusterrolebinding` to check what's
# granted where -- read-only, no write/escalate/bind, so this can't be used
# to self-grant anything, just to see the current state.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: claude-code-rbac-view
rules:
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["clusterroles", "clusterrolebindings", "roles", "rolebindings"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: claude-code-rbac-view
subjects:
  - kind: ServiceAccount
    name: claude-code
    namespace: default
roleRef:
  kind: ClusterRole
  name: claude-code-rbac-view
  apiGroup: rbac.authorization.k8s.io
