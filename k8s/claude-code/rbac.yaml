apiVersion: v1
kind: ServiceAccount
metadata:
  name: claude-code
  namespace: default
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: claude-code-edit
  namespace: default
subjects:
  - kind: ServiceAccount
    name: claude-code
    namespace: default
roleRef:
  kind: ClusterRole
  name: edit
  apiGroup: rbac.authorization.k8s.io
---
# Read-only access into `monitoring` so the claude-code pod can inspect the
# VictoriaMetrics/VictoriaLogs/Perses/otel-collector stack (kubectl get/logs)
# without kubectl port-forward or the Service-DNS+urllib workaround. Binds
# the built-in `view` ClusterRole (kept in sync with upstream automatically
# as new resource types are aggregated into it) plus a small supplemental
# Role for `pods/log`, which `view` deliberately excludes by default.
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: claude-code-monitoring-view
  namespace: monitoring
subjects:
  - kind: ServiceAccount
    name: claude-code
    namespace: default
roleRef:
  kind: ClusterRole
  name: view
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: claude-code-monitoring-pod-logs
  namespace: monitoring
rules:
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: claude-code-monitoring-pod-logs
  namespace: monitoring
subjects:
  - kind: ServiceAccount
    name: claude-code
    namespace: default
roleRef:
  kind: Role
  name: claude-code-monitoring-pod-logs
  apiGroup: rbac.authorization.k8s.io
---
# Cluster-scoped ClusterRole/ClusterRoleBinding objects can't be granted via a
# namespace-scoped Role, hence the ClusterRole+ClusterRoleBinding here. No
# escalate/bind verbs: Kubernetes' built-in escalation check means claude-code
# can still only create/update ClusterRoles and ClusterRoleBindings that grant
# permissions it already holds (edit in default, view+pods/log in monitoring),
# so this can't be used to self-grant cluster-admin.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: claude-code-rbac-admin
rules:
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["clusterroles", "clusterrolebindings"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: claude-code-rbac-admin
subjects:
  - kind: ServiceAccount
    name: claude-code
    namespace: default
roleRef:
  kind: ClusterRole
  name: claude-code-rbac-admin
  apiGroup: rbac.authorization.k8s.io
